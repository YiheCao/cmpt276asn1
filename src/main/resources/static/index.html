<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My webpage</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/script.js" defer></script>
</head>
<body>
    <header>
        WEATHER FINDER
    </header>  
    <main id="mainpart">
        <h1>

        </h1>
        <section class="sec1">
            Type in a city name or click on one of the top 10 cities of Canada
        </section>
        <form action="/submit">
            <fieldset>
                <legend>View City</legend>
   
                <label for="cityIn">City:</label>
                <input type="text" id="cityIn" placeholder="Enter city">

                <button id="cityButton" type="button">Search</button>

                <div id="error"></div>

            </fieldset>
        </form>
        <table>
            <tr><th>City Name</th><th><div class="outputBox" name="cityName" id="cname"></div></th></tr>
            <tr><th>Temperature</th><th><div class="outputBox" name="cityTemp" id="temp"></div></th></tr>
            <tr><th>Wind</th><th><div class="outputBox" name="cityWind" id="wind"></div></th></tr>
            <tr><th>Rain</th><th><div class="outputBox" name="cityRain" id="rain"></div></th></tr>
        </table>
        <table>
            <fieldset>
                <legend>Top 10 cities in Canada according to me</legend>
                <button class="cities" id="Vancouver">Vancouver</button>
                <button class="cities" id="Victoria">Victoria</button>
                <button class="cities" id="Toronto">Toronto</button>
                <button class="cities" id="Montreal">Montreal</button>
                <button class="cities" id="Calgary">Calgary</button>
                <button class="cities" id="Ottawa">Ottawa</button>
                <button class="cities" id="Edmonton">Edmonton</button>
                <button class="cities" id="Winnipeg">Winnipeg</button>
                <button class="cities" id="Halifax">Halifax</button>
                <button class="cities" id="Saskatoon">Saskatoon</button>
  

            </fieldset>
        </table>

    </main>
    <footer>
        Copyright Yi He Cao 2026 student number 301663106
    </footer>
</body>
</html>
